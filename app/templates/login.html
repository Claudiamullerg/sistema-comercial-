{% extends "base.html" %}
{% block content %}
<div class="block" style="max-width:380px;margin:60px auto">
  <h2>Entrar</h2>
  {% if error %}<p class="crit">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="password">Contraseña del panel</label><input id="password" type="password" name="password" autofocus></div>
    <p><button type="submit">Entrar</button></p>
  </form>
</div>
{% endblock %}
